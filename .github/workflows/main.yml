name: Build DeePDF APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install Flet & Build APK
        run: |
          pip install flet
          flet build apk --project "DeePDF" --product "DeePDF" --org "com.deepanshuarya.deepdf"
      - name: Upload deepdf.apk
        uses: actions/upload-artifact@v4
        with:
          name: deepdf-apk
          path: build/apk/*.apk
