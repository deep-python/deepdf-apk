name: Build DeePDF APK

on:
  push:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Files & Install Flet
        run: |
          ls -la
          python -m pip install --upgrade pip
          pip install "flet[all]==0.24.1" pypdf Pillow

      - name: Build Android APK
        run: |
          flet build apk --project "DeePDF" --product "DeePDF" --org "com.deepanshuarya.deepdf" --yes -v

      - name: Upload deepdf.apk
        uses: actions/upload-artifact@v4
        with:
          name: deepdf-apk
          path: build/apk/*.apk
